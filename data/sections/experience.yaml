    MODIS, soil grids). Collaborating with interdisciplinary teams to co-design sustainability
    indicators linking agricultural productivity and ecological resilience.
- position: Remote Intern
  institute: Institute of Crop Science and Resource Conservation (INRES)
  city: University of Bonn, Germany
  start: Feb. 2023
  end: Feb. 2024
  activities: Developed and validated ML/DL-based models (XGBoost, CNNs) for regional and
    continental-scale crop yield prediction using satellite-derived vegetation indices and
    climate data. Performed phenological and climate feature extraction using Google Earth
