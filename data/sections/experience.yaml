# Newest first
- position: Research Scientist
  institute: Leibniz Centre for Agricultural Landscape Research (ZALF)
  city: Müncheberg, Brandenburg, Germany
  start: Jan. 2025
  end: Present
  activities: Working within the Research Platform *Simulation and Data Science*, under the
    Working Group *Multi-Scale Modelling and Forecasting (MSM)*, contributing to the
    Leibniz-Lab Systemic Sustainability (LL SYSTAIN) project. Developing machine learning
    workflows for multi-scale crop yield forecasting and scenario analysis integrating
    climate, soil, and biodiversity indicators. Applying geospatial data science techniques
