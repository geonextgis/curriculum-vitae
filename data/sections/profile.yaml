- text: PhD researcher in landscape-scale agroecosystem modelling, specializing in geospatial data science, machine learning, and agricultural systems modelling. I develop machine learning, deep learning, and hybrid process-based modelling workflows for crop modelling, yield forecasting, crop mapping, and climate change impact assessment, leveraging large-scale Earth observation, climate, and soil datasets. My research interests include open science, scientific software development, and advancing agricultural science and technology to address real-world challenges, particularly in underserved regions and vulnerable agricultural systems.
