# CV Data Configuration
# This file contains configuration for accessing CV data from GitHub

# GitHub repository settings
# Leave cv_data_repo empty to read the YAML files in local_data_dir only.
# To keep the data in a separate repository (like blenback/profi), set it
# to "owner/repo" and the local files become the fallback.
cv_data_repo: ""
cv_data_branch: "main"

# Visual theme. One of: warm | forest | subtle
# Override at render time without editing this file via the CV_THEME env var,
# e.g. CV_THEME=forest. Themes are defined in themes/themes.yml (see README).
theme: subtle

# Local fallback settings
use_local_fallback: true
local_data_dir: "data/sections"

# Section display limits (set to null for no limit)
max_entries:
  experience: 6
  articles: null
  presentations: null

# Section files
sections:
  contact: "contact.yaml"
  profile: "profile.yaml" 
  skills: "skills.yaml"
  languages: "languages.yaml"
  education: "education.yaml"
  experience: "experience.yaml"
  events: "events.yaml"
  awards: "awards.yaml"
  publications: "publications.yaml"
  presentations: "presentations.yaml"
  posters: "posters.yaml"
  packages: "packages.yaml"
  achievements: "achievements.yaml"
  journals: "journals.yaml"